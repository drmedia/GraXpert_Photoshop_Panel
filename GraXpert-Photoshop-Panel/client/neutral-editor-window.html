<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>GraXpert Neutralise Editor</title>
  <link rel="stylesheet" href="sample-editor-window.css">
</head>
<body data-editor-mode="neutralize">
  <header>
    <div>
      <h1>GraXpert Neutralise Editor</h1>
      <div id="selectionStatus" class="sub">메인 패널에 연결하는 중…</div>
    </div>
    <div class="header-actions">
      <div id="sampleCount" class="count">0 usable points</div>
      <button id="closeEditor" class="close-btn" type="button">창 닫기</button>
    </div>
  </header>

  <div class="toolbar">
    <label class="preview-stretch-label">Preview Stretch
      <select id="stretchPreset">
        <option>No Stretch</option>
        <option>10% Bg, 3 sigma</option>
        <option>15% Bg, 3 sigma</option>
        <option>20% Bg, 3 sigma</option>
        <option>30% Bg, 2 sigma</option>
      </select>
    </label>
    <label class="saturation-label">Saturation <output id="saturationValue">1.0</output>
      <input id="saturation" type="range" min="0" max="3" step="0.1" value="1">
    </label>
    <label title="GraXpert Points per row 값입니다. 이미지 가로 한 줄에 배치할 Grid 포인트 수입니다.">행당 포인트
      <input id="pointsPerRow" type="number" min="4" max="25" step="1" value="15">
    </label>
    <label title="GraXpert Grid Tolerance 값입니다. 높을수록 더 밝은 배경 후보도 허용합니다.">Grid Tolerance
      <input id="gridTolerance" type="number" min="-2" max="10" step="0.1" value="1.0">
    </label>
    <label title="GraXpert sample_size 값입니다. 25이면 포인트 주변 약 50×50px 영역을 계산합니다.">Sample Size
      <input id="sampleSize" type="number" min="2" max="200" step="1" value="25">
    </label>
    <label class="check hidden"><input id="selectionOnly" type="checkbox"> 분석 영역만</label>
    <div class="editor-button-group">
      <button id="autoSamples" type="button">배경 후보 다시 생성</button>
      <button id="undoSample" type="button">실행 취소</button>
      <button id="clearSamples" type="button">전체 삭제</button>
    </div>
  </div>

  <main id="canvasWrap">
    <canvas id="sampleCanvas"></canvas>
    <div id="emptyMessage">Neutralise Preview가 준비되지 않았습니다.</div>
  </main>

  <footer>
    <div class="legend"><span class="good">● 적합</span><span class="warning">● 주의</span><span class="exclude">● 제외</span></div>
    <div id="pointInfo">좌클릭: Reference Point 추가 · 우클릭: Sample 사각 영역의 Point 삭제</div>
    <div id="qualityReport"></div>
  </footer>

  <script src="sample-editor-window.js"></script>
</body>
</html>
